[project]
name = "ingestion-runtime"
version = "0.1.0"
description = "Container entrypoint glue wiring live_ingestion to the market-data-db HTTP API"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "live-ingestion",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
