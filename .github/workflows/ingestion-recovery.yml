name: Ingestion recovery
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Previously validated GHCR image digest
        required: true
      approval_sha:
        description: Commit SHA explicitly approved for rollback
        required: true
permissions:
  contents: read
jobs:
  recovery:
    if: vars.INGESTION_RECOVERY_ENABLED == 'true' && inputs.approval_sha == github.sha
    uses: ./.github/workflows/reusable-deployment.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      service: ingestion
      target: production
      image: ${{ inputs.digest }}
