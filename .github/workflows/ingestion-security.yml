# Ingestion-only reusable workflow. Invoked by ingestion-pipeline.yml.
name: Ingestion security
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned free scanners
        run: |
          python -m pip install semgrep==1.145.0 pip-audit==2.9.0
      - name: SAST
        run: semgrep scan --config p/python --error Data_Ingestion/Live/live_ingestion Data_Ingestion/Backfill/backfill_engine Data_Ingestion/ingestion_runtime
      - name: Dependency audit
        run: pip-audit -r Data_Ingestion/ci-requirements.txt
      - name: Secret and policy checks
        run: python Data_Ingestion/ci/policy.py
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@c7debcf36a8a5ba1f3a9fdf6dc146a0c39dd81e5 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Hadolint
        uses: hadolint/hadolint-action@3e45171c50d9f59e2a4d3cf8bc5d6c6be6a703c2 # v3.1.0
        with:
          dockerfile: Data_Ingestion/Dockerfile
      - name: Checkov
        uses: bridgecrewio/checkov-action@9d0b7a134f534c1f0fcb6e4bb39a9603436ca20a # v12.3053.0
        with:
          directory: Data_Ingestion
          framework: dockerfile
      - name: Actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
