name: Ingestion staging
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
permissions:
  contents: read
jobs:
  deploy:
    uses: ./.github/workflows/reusable-deployment.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      service: ingestion
      target: staging
      image: ${{ inputs.image }}
