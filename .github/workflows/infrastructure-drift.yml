name: Infrastructure drift detection
# Scheduled read-only audit of the live OCI deployment.
#
# infrastructure-plan.yml only runs when infrastructure/terraform/** changes,
# so nothing noticed a resource edited in the OCI console, a free allowance
# quietly exceeded, or a billable resource created by hand. This workflow is
# the standing check for all three. It takes no state lock and applies
# nothing, so it is safe to run alongside an operator's own work.
on:
  schedule:
    # 06:12 UTC daily. Off the hour so it does not land in the spike of
    # scheduled jobs that GitHub defers at exact-hour cron times, and early
    # enough that a finding is waiting at the start of the day.
    - cron: '12 6 * * *'
  workflow_dispatch:
    inputs:
      cost_days:
        description: 'Days of billing history to examine'
        required: false
        default: '3'
        type: string
permissions:
  contents: read
  # Needed to raise and update the drift issue.
  issues: write
concurrency:
  # Deliberately NOT the algot-terraform-state group: this workflow only
  # reads, and it must never queue behind -- or hold up -- an apply.
  group: infra-drift
  cancel-in-progress: true
jobs:
  drift:
    name: Detect drift against live infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Holds OCI credentials, so it runs under the same environment as the
    # plan workflow and never on a pull request.
    environment: infrastructure-plan
    outputs:
      status: ${{ steps.detect.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the OCI CLI
        run: pip install oci-cli==3.97.1 pyyaml

      - name: Write OCI credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem

      - name: Pull remote state
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
        run: bash deployment/scripts/terraform-state.sh pull

      - name: Detect drift
        id: detect
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: /home/runner/.oci/api_key.pem
          TF_VAR_oci_config_file_profile: 'null'
          TF_VAR_region: ${{ vars.OCI_REGION || 'uk-london-1' }}
          TF_VAR_api_allowed_cidrs: ${{ vars.API_ALLOWED_CIDRS || '[]' }}
          COST_DAYS: ${{ inputs.cost_days || '3' }}
        run: |
          set +e
          bash deployment/scripts/drift-detect.sh all > drift-report.txt 2>&1
          code=$?
          set -e
          cat drift-report.txt

          case "$code" in
            0) echo 'status=clean'  >> "$GITHUB_OUTPUT" ;;
            2) echo 'status=drift'  >> "$GITHUB_OUTPUT" ;;
            *) echo 'status=broken' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Drift detection: ${{ steps.detect.outputs.status }}"
            echo '```'
            # The report names resources and OCIDs but holds no secret values.
            cat drift-report.txt 2>/dev/null || echo 'the check produced no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The report is useful even on a clean run, for the record of what the
      # deployment looked like. Short retention: it enumerates OCIDs.
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drift-report-${{ github.run_id }}
          path: drift-report.txt
          if-no-files-found: warn
          retention-days: 14

      # One issue, reopened and updated, rather than a new issue every day.
      - name: Open or update the drift issue
        if: steps.detect.outputs.status != 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.detect.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Infrastructure drift detected in the OCI deployment'

          {
            if [[ "$STATUS" == "broken" ]]; then
              echo "The drift check could not complete. Treat this as unknown state, not as a clean result."
            else
              echo "The scheduled audit found drift between the Terraform configuration, the live"
              echo "OCI resources and the bill."
            fi
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            cat drift-report.txt
            echo '```'
            echo
            echo "Nothing was changed: the check is read-only. Reconcile with"
            echo '`terraform plan`, then apply through the Infrastructure apply workflow.'
          } > issue-body.md

          EXISTING="$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')"

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body-file issue-body.md
            echo "Updated issue #$EXISTING."
          else
            gh issue create --title "$TITLE" --body-file issue-body.md \
              --label infrastructure 2>/dev/null \
              || gh issue create --title "$TITLE" --body-file issue-body.md
          fi

      - name: Fail the run if the deployment has drifted
        if: steps.detect.outputs.status != 'clean'
        run: |
          echo "::error::drift status is ${{ steps.detect.outputs.status }}"
          exit 1
