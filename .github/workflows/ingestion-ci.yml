# Ingestion-only reusable workflow. Invoked by ingestion-pipeline.yml.
name: Ingestion CI
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Data_Ingestion/ci-requirements.txt
      - name: Install locked test dependencies
        run: python -m pip install -r Data_Ingestion/ci-requirements.txt
      - name: Install local packages without dependency resolution
        run: python -m pip install --no-deps -e Data_Ingestion/Live -e Data_Ingestion/Backfill -e Data_Ingestion
      - name: Syntax and compile
        run: python -m compileall -q Data_Ingestion/Live Data_Ingestion/Backfill Data_Ingestion/ingestion_runtime
      - name: Lint and formatting
        run: |
          ruff check Data_Ingestion/Live/live_ingestion Data_Ingestion/Backfill/backfill_engine Data_Ingestion/ingestion_runtime
          ruff format --check Data_Ingestion/Live/live_ingestion Data_Ingestion/Backfill/backfill_engine Data_Ingestion/ingestion_runtime
      - name: Static types
        run: mypy --follow-imports=silent --ignore-missing-imports Data_Ingestion/ingestion_runtime
      - name: Mocked unit, integration and regression tests with coverage
        run: |
          pytest -q Data_Ingestion/Live/live_ingestion/tests Data_Ingestion/Backfill/backfill_engine/tests Data_Ingestion/ingestion_runtime/tests --cov=live_ingestion --cov=backfill_engine --cov=ingestion_runtime --cov-report=term-missing --cov-fail-under=70
