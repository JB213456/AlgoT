name: System integration
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      prevalidated:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: system-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    if: ${{ !inputs.prevalidated }}
    uses: ./.github/workflows/reusable-ci.yml
    with:
      service: database
  ingestion:
    if: ${{ !inputs.prevalidated }}
    uses: ./.github/workflows/reusable-ci.yml
    with:
      service: ingestion
  compatibility:
    needs: [database, ingestion]
    if: always() && (inputs.prevalidated || (needs.database.result == 'success' && needs.ingestion.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c Data/Database/constraints.lock -e './Data/Database[server,dev]' -e Data/Data_Ingestion/Live -e Data/Data_Ingestion/Backfill -e Data/Data_Ingestion httpx
      - run: python -m pytest -q system_tests
      - name: Isolated container network and simulated ingestion
        run: bash system_tests/container_network_smoke.sh
  quality-gate:
    if: always()
    needs: [database, ingestion, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.database.result }},${{ needs.ingestion.result }},${{ needs.compatibility.result }}
        run: |
          if [ "${{ inputs.prevalidated }}" = true ]; then
            test "${{ needs.compatibility.result }}" = success
          else
            test "$RESULTS" = 'success,success,success'
          fi
