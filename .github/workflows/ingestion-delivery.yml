name: Ingestion delivery
on:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.publish.outputs.image }}
    inputs:
      release:
        type: boolean
        required: true
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publish:
    if: inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ingestion-image
          path: /tmp
      - name: Load validated image and authenticate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load -i /tmp/ingestion-image.tar
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Promote exact image and record digest
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/algot-ingestion
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag ingestion-candidate:${{ github.sha }} "$IMAGE:sha-${{ github.sha }}"
          docker push "$IMAGE:sha-${{ github.sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-${{ github.sha }}")
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$DIGEST" > /tmp/validated-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ingestion-digest
          path: /tmp/validated-digest.txt
          retention-days: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
