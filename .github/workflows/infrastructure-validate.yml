name: Infrastructure validation
# Runs on untrusted pull requests, so it holds NO credentials and makes no
# OCI API calls. Everything here is static analysis plus the free-tier
# policy unit tests.
on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - 'kubernetes/**'
      - 'deployment/**'
      - '.github/workflows/infrastructure-*.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'kubernetes/**'
      - 'deployment/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infra-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    name: Terraform format, validate and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive -diff

      - name: Validate without a backend or credentials
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false -input=false
          terraform -chdir=infrastructure/terraform validate

      - name: Confirm the provider lockfile is committed and pinned
        run: |
          LOCK=infrastructure/terraform/.terraform.lock.hcl
          test -f "$LOCK" || { echo "::error::$LOCK is not committed"; exit 1; }
          grep -q 'registry.terraform.io/oracle/oci' "$LOCK" \
            || { echo "::error::oracle/oci is not pinned in the lockfile"; exit 1; }
          echo "Lockfile present and pinned."

  free-tier-policy:
    name: Free-tier policy gate unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      # These tests assert the gate REJECTS over-allocation, paid shapes,
      # enhanced clusters and destruction of the database volume. If they
      # fail, the cost guard is not trustworthy.
      - run: pytest infrastructure/terraform/policies/free-tier/ -v

  terraform-security:
    name: Terraform security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Skips live in infrastructure/terraform/.checkov.yaml, next to the code
      # they apply to and with the reason for each recorded, so a local run
      # (`checkov --config-file infrastructure/terraform/.checkov.yaml`)
      # evaluates exactly what CI evaluates.
      - name: Checkov
        uses: bridgecrewio/checkov-action@471d019012b72cd1e7bb2ee602961347c9ccf560 # v12.3053.0
        with:
          directory: infrastructure/terraform
          config_file: infrastructure/terraform/.checkov.yaml
          output_format: cli
          soft_fail: false

  shell-scripts:
    name: Deployment script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # SC1091: sourced files are not present in CI.
          find deployment/scripts -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning --exclude=SC1091
      - name: Confirm no secrets are committed
        run: |
          # Anchored to the start of the basename, so a *script* that merely
          # has one of these words in its name is not a finding. A bare
          # `kubeconfig` substring matched
          # deployment/scripts/setup-kubeconfig.sh, which is source code and
          # holds no credential.
          PATTERN='(^|/)\.env$|\.pem$|(^|/)terraform\.tfvars$|(^|/)kubeconfig(\.(ya?ml|json|conf|config))?$|\.kubeconfig$|(^|/)\.kube/|(^|/)id_(rsa|ed25519)$'
          if git ls-files | grep -vE '\.env\.example$' | grep -qE "$PATTERN"; then
            echo "::error::a credential-bearing file is tracked"
            git ls-files | grep -vE '\.env\.example$' | grep -E "$PATTERN"
            exit 1
          fi
          echo "No credential files tracked."
