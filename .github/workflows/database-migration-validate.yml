name: Database migration validation
# A schema migration is the one deployment step no image rollback undoes:
# rolling the container back does not un-drop a column. So the migration
# chain is gated before any image is built, and independently of whether
# anything is being deployed.
#
# This workflow holds NO credentials and never touches the production
# database. It exercises the chain against throwaway SQLite files on the
# runner, which is why it is safe to run on pull requests from forks --
# including the append-only check, which only reads git history.
on:
  pull_request:
    paths:
      - 'Data/Database/market_data_db/metadata/**'
      - 'deployment/scripts/validate-migrations.py'
      - 'deployment/scripts/test_validate_migrations.py'
      - '.github/workflows/database-migration-validate.yml'
  push:
    branches: [main]
    paths:
      - 'Data/Database/market_data_db/metadata/**'
      - 'deployment/scripts/validate-migrations.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db-migration-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migrations:
    name: Validate the schema migration chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The append-only check compares this revision's migrator against
          # the base revision, so the base commit must be in the clone.
          # Depth 0 fetches the full history; a shallow clone would make the
          # comparison silently impossible.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Data/Database/constraints.lock
            Data/Database/requirements.txt

      - name: Install the Database package
        run: python -m pip install -c Data/Database/constraints.lock -e './Data/Database[server,dev]'

      # The gate is tested before it is trusted: these assertions are mostly
      # of the form "the gate REJECTS a DROP TABLE". A silently broken gate
      # would report a clean pass over a destructive migration forever.
      - name: Test the gate itself
        run: python -m pytest deployment/scripts/test_validate_migrations.py -q

      - name: Resolve the base revision
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # On a pull request the base is the merge target. On a push it is
          # the previous tip, except for the first push to a branch, where
          # GitHub sends an all-zero SHA and there is nothing to compare to.
          case "$EVENT" in
            pull_request) REF="$BASE_SHA" ;;
            push) REF="$BEFORE" ;;
            *) REF="" ;;
          esac
          if [[ -z "$REF" || "$REF" =~ ^0+$ ]]; then
            echo "no usable base revision for event $EVENT; the append-only check will be skipped"
            echo 'ref=' >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$REF^{commit}" 2>/dev/null; then
            echo "comparing against $REF"
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "::error::base revision $REF is not in this clone; the append-only check cannot run"
            exit 1
          fi

      - name: Validate the chain
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          ARGS=()
          if [[ -n "$BASE_REF" ]]; then
            ARGS+=(--base-ref "$BASE_REF")
          else
            ARGS+=(--no-append-only)
          fi
          python3 deployment/scripts/validate-migrations.py "${ARGS[@]}" \
            | tee migration-report.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo '## Schema migration validation'
            echo '```'
            cat migration-report.txt 2>/dev/null || echo 'the gate produced no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
