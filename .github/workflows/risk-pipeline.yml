name: Risk pipeline (inactive)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require tracked service source before enabling pipeline
        run: |
          test -n "$(git ls-files 'Core/Risk_Management/')"
          echo 'risk requires service-specific CI, security, build, performance and deployment jobs before release.' >&2
          exit 1
