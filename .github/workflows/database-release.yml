name: Data/Database release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing database-vMAJOR.MINOR.PATCH tag version
        required: true
      sha:
        description: Exact commit SHA validated by monorepo CI
        required: true
      run_id:
        description: Successful monorepo CI run ID for that commit
        required: true
permissions:
  contents: read
jobs:
  release:
    if: vars.DATABASE_RELEASE_ENABLED == 'true' && vars.GHCR_PRIVATE_CONFIRMED == 'true'
    uses: ./.github/workflows/reusable-publish.yml
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      service: database
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
  staging:
    needs: release
    if: needs.release.result == 'success' && vars.STAGING_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/database-staging.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      image: ${{ needs.release.outputs.image }}
