name: ARM64 image build and publish
# The OKE worker nodes are Ampere A1 (aarch64), so every image must provide
# linux/arm64. These builds run on native arm64 runners -- free for public
# repositories -- rather than under qemu emulation, which is slow and has
# produced subtly broken wheels for packages like pyarrow and duckdb.
#
# Images go to private OCI Container Registry repositories, not GHCR: OCIR
# repositories are private by default, whereas GHCR packages are created
# public on first push. Credentials come from OCI Vault via the OCI API key,
# so no registry password is held as a GitHub secret.
#
# This workflow complements the existing amd64 build and release chain; it
# does not replace it. Images are published by immutable digest. It is
# dispatched manually because it can read the production Vault auth token.
#
# Images are signed with the cosign key held in OCI Vault -- the same key
# deployment/scripts/build-arm64-images.sh uses -- rather than with a
# keyless Sigstore identity. One public key
# (deployment/security/cosign.pub) then verifies every arm64 image whether
# it was built here or by an operator, so the deploy-time check has a single
# trust root. GitHub's own build provenance is attached as well.
on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Image to build'
        required: true
        default: 'all'
        type: choice
        options: [all, database, ingestion, toolbox]
permissions:
  contents: read
concurrency:
  group: arm64-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.service }} (linux/arm64)
    # Native aarch64 runner: no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Required by actions/attest-build-provenance for its OIDC token.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: database
            context: Data/Database
            smoke: 'python -c "import market_data_db, duckdb, pyarrow; print(1)"'
          - service: ingestion
            context: Data/Data_Ingestion
            smoke: 'python -c "import live_ingestion, backfill_engine, ingestion_runtime; print(1)"'
          - service: toolbox
            context: deployment/toolbox
            smoke: 'python3 -c "import oci; print(1)"'
    steps:
      - name: Skip services not selected
        id: selected
        env:
          CHOICE: ${{ inputs.service || 'all' }}
          SERVICE: ${{ matrix.service }}
        run: |
          if [[ "$CHOICE" == "all" || "$CHOICE" == "$SERVICE" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.selected.outputs.run == 'true'

      - name: Confirm the runner really is arm64
        if: steps.selected.outputs.run == 'true'
        run: |
          ARCH="$(uname -m)"
          echo "runner architecture: $ARCH"
          [[ "$ARCH" == "aarch64" ]] || { echo "::error::expected an aarch64 runner, got $ARCH"; exit 1; }

      - name: Verify the build context is isolated
        if: steps.selected.outputs.run == 'true'
        env:
          CONTEXT: ${{ matrix.context }}
        run: |
          # Matches the existing amd64 build's guard: the Strategies tree must
          # never enter a service image's build context.
          test ! -e "$CONTEXT/Strategies"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.selected.outputs.run == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.selected.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install the OCI CLI
        if: steps.selected.outputs.run == 'true'
        run: pip install oci-cli==3.97.1

      - name: Install checksum-verified trivy, syft and cosign
        if: steps.selected.outputs.run == 'true'
        run: bash deployment/scripts/install-security-tools.sh

      - name: Write the OCI API key
        if: steps.selected.outputs.run == 'true'
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem

      - name: Resolve the registry and log in with the token from Vault
        if: steps.selected.outputs.run == 'true'
        id: registry
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
          VAULT_ID: ${{ secrets.OCI_VAULT_OCID }}
        run: |
          OCIR_NS="$(oci os ns get --query data --raw-output)"
          REGISTRY="${{ vars.OCIR_REGISTRY || 'lhr.ocir.io' }}"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "namespace=$OCIR_NS" >> "$GITHUB_OUTPUT"

          # The registry password is an auth token held in OCI Vault, not a
          # GitHub secret.
          TOKEN="$(oci secrets secret-bundle get-secret-bundle-by-name \
            --secret-name algot-ocir-auth-token --vault-id "$VAULT_ID" \
            --query 'data."secret-bundle-content".content' --raw-output | base64 -d)"
          [ -n "$TOKEN" ] || { echo "::error::no OCIR auth token in Vault"; exit 1; }

          USER_NAME="$(oci iam user get --user-id "$OCI_CLI_USER" --query 'data.name' --raw-output)"
          printf '%s' "$TOKEN" | docker login "$REGISTRY" -u "$OCIR_NS/$USER_NAME" --password-stdin

      - name: Build and push
        if: steps.selected.outputs.run == 'true'
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.namespace }}/algot-${{ matrix.service }}:arm64-${{ github.sha }}
          cache-from: type=gha,scope=arm64-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=arm64-${{ matrix.service }}

      - name: Verify the image is arm64 and runs as non-root
        if: steps.selected.outputs.run == 'true'
        env:
          IMAGE: ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.namespace }}/algot-${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          ARCH="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Image.Architecture}}')"
          echo "image architecture: $ARCH"
          [[ "$ARCH" == "arm64" ]] || { echo "::error::image is $ARCH, not arm64"; exit 1; }

          USER_SPEC="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Image.Config.User}}')"
          echo "image user: ${USER_SPEC:-<root>}"
          # A root image would be rejected by the namespace's restricted
          # Pod Security Standards at admission time.
          [[ -n "$USER_SPEC" && "$USER_SPEC" != "root" && "$USER_SPEC" != "0" ]] \
            || { echo "::error::image does not declare a non-root USER"; exit 1; }

      - name: Scan for vulnerabilities
        if: steps.selected.outputs.run == 'true'
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.namespace }}/algot-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke test the published image
        if: steps.selected.outputs.run == 'true'
        env:
          IMAGE: ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.namespace }}/algot-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          # Pulled back from the registry by digest, so the test covers the
          # exact artifact the cluster will pull. The runner is natively
          # aarch64, so this needs no emulation.
          docker run --rm --entrypoint sh "$IMAGE" -c "$SMOKE"

      - name: Generate the CycloneDX SBOM
        if: steps.selected.outputs.run == 'true'
        env:
          IMAGE: ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.namespace }}/algot-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          syft --quiet "registry:$IMAGE" --platform linux/arm64 \
            -o "cyclonedx-json=/tmp/$SERVICE-arm64.cdx.json"
          python3 - "/tmp/$SERVICE-arm64.cdx.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["bomFormat"] == "CycloneDX", d.get("bomFormat")
          assert d["components"], "SBOM lists no components"
          print(f"{len(d['components'])} components")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.selected.outputs.run == 'true'
        with:
          name: ${{ matrix.service }}-arm64-sbom
          path: /tmp/${{ matrix.service }}-arm64.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Sign the digest and attach attestations
        if: steps.selected.outputs.run == 'true'
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
          VAULT_ID: ${{ secrets.OCI_VAULT_OCID }}
          IMAGE: ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.namespace }}/algot-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          # The signing key lives in Vault, like the registry token. Nothing
          # is printed, and the key is shredded when the step ends.
          KEYDIR="$(mktemp -d)"
          chmod 700 "$KEYDIR"
          trap 'find "$KEYDIR" -type f -exec shred -u {} + 2>/dev/null || true; rm -rf "$KEYDIR"' EXIT

          oci secrets secret-bundle get-secret-bundle-by-name \
            --secret-name algot-cosign-private-key --vault-id "$VAULT_ID" \
            --query 'data."secret-bundle-content".content' --raw-output \
            | base64 -d > "$KEYDIR/cosign.key"
          COSIGN_PASSWORD="$(oci secrets secret-bundle get-secret-bundle-by-name \
            --secret-name algot-cosign-password --vault-id "$VAULT_ID" \
            --query 'data."secret-bundle-content".content' --raw-output | base64 -d)"
          export COSIGN_PASSWORD
          chmod 600 "$KEYDIR/cosign.key"
          [ -s "$KEYDIR/cosign.key" ] && [ -n "$COSIGN_PASSWORD" ] \
            || { echo "::error::no cosign signing key in Vault; run vault-secrets.sh cosign-key"; exit 1; }

          cosign sign --yes --key "$KEYDIR/cosign.key" "$IMAGE" >/dev/null 2>&1
          cosign attest --yes --key "$KEYDIR/cosign.key" --type cyclonedx \
            --predicate "/tmp/$SERVICE-arm64.cdx.json" "$IMAGE" >/dev/null 2>&1

          # Verified against the committed public key, which is the same
          # check deployment/scripts/deploy-data-platform.sh performs.
          cosign verify --key deployment/security/cosign.pub "$IMAGE" >/dev/null 2>&1
          cosign verify-attestation --key deployment/security/cosign.pub \
            --type cyclonedx "$IMAGE" >/dev/null 2>&1
          echo "signature and SBOM attestation verified"

      - name: Attest build provenance
        if: steps.selected.outputs.run == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.namespace }}/algot-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      - name: Record the digest
        if: steps.selected.outputs.run == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          {
            echo "### algot-$SERVICE (linux/arm64)"
            echo ''
            echo "    ${{ steps.registry.outputs.registry }}/${{ steps.registry.outputs.namespace }}/algot-$SERVICE@$DIGEST"
            echo ''
            echo 'Signed, SBOM attached and attested.'
            echo 'Record this digest in deployment/manifests/arm64-digests.json to deploy it.'
          } >> "$GITHUB_STEP_SUMMARY"

  confirm-private:
    name: Confirm OCIR repositories are private
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install oci-cli==3.97.1
      - name: Write the OCI API key
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem
      # OCIR repositories are private by default, so this is a regression
      # check rather than a remediation step. It fails the run if any
      # repository has been made public.
      - name: Check repository visibility and storage
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
          COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          # One API call, then evaluate in Python. JMESPath filters need
          # backticks, which are awkward to quote safely inside a shell
          # heredoc, so the logic lives in Python instead.
          oci artifacts container repository list -c "$COMPARTMENT" --all > repos.json
          python3 - <<'PY'
          import json, pathlib, sys

          items = json.loads(pathlib.Path("repos.json").read_text())["data"]["items"]
          algot = [r for r in items if (r.get("display-name") or "").startswith("algot-")]

          if not algot:
              sys.exit("::error::no algot-* repositories found in this compartment")

          public = [r["display-name"] for r in algot if r.get("is-public")]
          total = sum(float(r.get("billable-size-in-gbs") or 0) for r in algot)

          for r in sorted(algot, key=lambda x: x["display-name"]):
              print(f"  {r['display-name']:20s} public={r.get('is-public')} "
                    f"size={r.get('billable-size-in-gbs')} GB")

          # Container Registry storage is not enumerated in Oracle's Always
          # Free list, so usage is reported on every build.
          print(f"\nTotal billable image storage: {total:.3f} GB")

          if public:
              sys.exit(f"::error::these OCIR repositories are public, but AlgoT "
                       f"images must be private: {', '.join(public)}")
          print("All AlgoT repositories are private.")

          # Same budget the GC script enforces. Every rebuild leaves the
          # previous manifest untagged but still billable, so without
          # reclamation these repositories grow without bound.
          budget = float("${{ vars.REGISTRY_STORAGE_BUDGET_GB || '5' }}")
          if total > budget:
              sys.exit(f"::error::image storage {total:.3f} GB exceeds the "
                       f"{budget:.1f} GB budget. Run "
                       f"deployment/scripts/registry-gc.sh --apply to reclaim "
                       f"superseded manifests.")
          print(f"Storage is within the {budget:.1f} GB budget.")
          PY
