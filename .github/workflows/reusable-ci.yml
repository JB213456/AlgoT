name: Shared service CI
on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Data/Data_Ingestion/ci-requirements.txt
            Data/Database/requirements.txt
            Data/Database/constraints.lock
      - name: Verify service and install dependencies
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            database) python -m pip install -c Data/Database/constraints.lock -e './Data/Database[server,dev]' httpx ;;
            ingestion) python -m pip install -r Data/Data_Ingestion/ci-requirements.txt && python -m pip install --no-deps -e Data/Data_Ingestion/Live -e Data/Data_Ingestion/Backfill -e Data/Data_Ingestion ;;
            *) echo 'Unsupported service' >&2; exit 1 ;;
          esac
      - name: Shared lint and syntax checks
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          python -m pip install 'ruff==0.14.5'
          case "$SERVICE" in
            database) DIRS=(Data/Database/market_data_db Data/Database/server Data/Database/tests) ;;
            ingestion) DIRS=(Data/Data_Ingestion/Live/live_ingestion Data/Data_Ingestion/Backfill/backfill_engine Data/Data_Ingestion/ingestion_runtime) ;;
          esac
          python -m compileall -q "${DIRS[@]}"
          ruff check --select E4,E7,E9,F --ignore E741 "${DIRS[@]}"
      - name: Run service tests
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            database) python -m pytest -q Data/Database/tests ;;
            ingestion) python -m pytest -q Data/Data_Ingestion/Live/live_ingestion/tests Data/Data_Ingestion/Backfill/backfill_engine/tests Data/Data_Ingestion/ingestion_runtime/tests ;;
          esac
