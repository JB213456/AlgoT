# Ingestion-only reusable workflow. Invoked by ingestion-pipeline.yml.
name: Ingestion data validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Data/Data_Ingestion/ci-requirements.txt
      - name: Install locked test dependencies
        run: python -m pip install -r Data/Data_Ingestion/ci-requirements.txt
      - name: Install local packages without dependency resolution
        run: python -m pip install --no-deps -e Data/Data_Ingestion/Live -e Data/Data_Ingestion/Backfill -e Data/Data_Ingestion
      - name: Provider, schema, database and resumability contracts (mocked)
        run: pytest -q Data/Data_Ingestion/Backfill/backfill_engine/tests Data/Data_Ingestion/Live/live_ingestion/tests/test_normalize.py Data/Data_Ingestion/Live/live_ingestion/tests/test_dedup.py Data/Data_Ingestion/ingestion_runtime/tests
      - name: Check no paid feed configuration or order endpoints
        run: python Data/Data_Ingestion/ci/policy.py
