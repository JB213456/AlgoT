# Ingestion-only reusable workflow. Invoked by ingestion-pipeline.yml.
name: Ingestion build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Compose with isolated test values
        env:
          ALPACA_API_KEY: dummy
          ALPACA_SECRET_KEY: dummy
        run: docker compose -f Data/Data_Ingestion/docker-compose.yml config -q
      - name: Build production image once
        run: docker build --pull -t ingestion-candidate:${{ github.sha }} Data/Data_Ingestion
      - name: Verify non-root user, CLI and healthcheck
        run: |
          test "$(docker image inspect ingestion-candidate:${{ github.sha }} --format '{{.Config.User}}')" = '10002:10002'
          docker run --rm --entrypoint market-backfill ingestion-candidate:${{ github.sha }} --help
          docker run --rm --entrypoint python ingestion-candidate:${{ github.sha }} -m ingestion_runtime.healthcheck || test "$?" -eq 1
      - name: Save exact validated image
        run: docker save ingestion-candidate:${{ github.sha }} -o /tmp/ingestion-image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ingestion-image
          path: /tmp/ingestion-image.tar
          retention-days: 1
          if-no-files-found: error
