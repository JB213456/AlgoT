name: Data platform deployment
# Deploys the algot-data namespace to OKE. Manual dispatch only, behind an
# environment, and gated on an explicit repository variable.
on:
  workflow_dispatch:
    inputs:
      component:
        description: 'What to deploy'
        required: true
        default: 'both'
        type: choice
        options: [both, database, ingestion]
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        type: string
      run_integration_tests:
        description: 'Run the on-cluster cross-service integration suite after deployment'
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  # Serialised, never cancelled: cancelling mid-deploy would leave the
  # namespace half-applied, and cancelling mid-rollback is worse. The same
  # group is used by the rollback workflow so the two cannot interleave.
  group: algot-data-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-data
    permissions:
      # No `packages` scope: images come from OCIR, and application secrets
      # come from OCI Vault. GitHub holds no registry or app credential.
      contents: read
      # Read-only, and only so the mandatory gates can be re-checked for the
      # commit being deployed.
      actions: read
    steps:
      - name: Check the confirmation phrase
        if: inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::confirm must be exactly DEPLOY"
          exit 1

      - name: Require the deployment switch
        if: vars.DATA_PLATFORM_DEPLOY_ENABLED != 'true'
        run: |
          echo "::error::set DATA_PLATFORM_DEPLOY_ENABLED=true to allow deployments"
          exit 1

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A dispatch can name any ref, so the security, testing and free-tier
      # gates are re-checked against the exact commit being deployed. Without
      # this they would be advisory: green on the pull request, with no
      # bearing on what reaches the cluster.
      - name: Require every mandatory gate to have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deployment/scripts/require-green-gates.sh "${{ github.sha }}"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - run: pip install oci-cli==3.97.1 pyyaml

      - name: Write OCI credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem

      - name: Verify every image is an arm64 digest reference
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
          VAULT_ID: ${{ secrets.OCI_VAULT_OCID }}
        run: |
          # Registry credentials come from OCI Vault, never a GitHub secret.
          OCIR_NS="$(oci os ns get --query data --raw-output)"
          REGISTRY="${{ vars.OCIR_REGISTRY || 'lhr.ocir.io' }}"
          TOKEN="$(oci secrets secret-bundle get-secret-bundle-by-name \
            --secret-name algot-ocir-auth-token --vault-id "$VAULT_ID" \
            --query 'data."secret-bundle-content".content' --raw-output | base64 -d)"
          [ -n "$TOKEN" ] || { echo "::error::no OCIR auth token in Vault"; exit 1; }
          USER_NAME="$(oci iam user get --user-id "$OCI_CLI_USER" --query 'data.name' --raw-output)"
          printf '%s' "$TOKEN" | docker login "$REGISTRY" -u "$OCIR_NS/$USER_NAME" --password-stdin
          python3 - <<'PY'
          import json, subprocess, sys, pathlib
          digests = json.loads(pathlib.Path("deployment/manifests/arm64-digests.json").read_text())
          failed = False
          for name, ref in digests.items():
              if "@sha256:" not in ref:
                  print(f"::error::{name} is not a digest reference: {ref}")
                  failed = True
                  continue
              raw = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", "--raw", ref],
                  capture_output=True, text=True, check=True).stdout
              manifest = json.loads(raw)
              arches = set()
              if "manifests" in manifest:
                  arches = {m["platform"]["architecture"] for m in manifest["manifests"]
                            if m.get("platform", {}).get("architecture") != "unknown"}
              else:
                  cfg = subprocess.run(
                      ["docker", "buildx", "imagetools", "inspect", ref, "--format", "{{.Image.Architecture}}"],
                      capture_output=True, text=True, check=True).stdout.strip()
                  arches = {cfg}
              if "arm64" not in arches:
                  print(f"::error::{name} does not provide linux/arm64 (found {arches})")
                  failed = True
              else:
                  print(f"  {name}: arm64 confirmed ({ref})")
          sys.exit(1 if failed else 0)
          PY

      - name: Pull Terraform state
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
        run: |
          terraform -chdir=infrastructure/terraform init -input=false -backend=false >/dev/null
          bash deployment/scripts/terraform-state.sh pull

      - name: Grant this runner temporary Kubernetes API access
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
        run: bash deployment/scripts/ci-api-access.sh grant

      - name: Configure kubectl
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
        run: |
          bash deployment/scripts/setup-kubeconfig.sh
          echo "KUBECONFIG=$HOME/.kube/algot-oke.config" >> "$GITHUB_ENV"

      - name: Record the current revision for rollback
        run: |
          mkdir -p /tmp/rollback
          kubectl -n algot-data get statefulset market-data-db -o json > /tmp/rollback/database.json 2>/dev/null || echo '{}' > /tmp/rollback/database.json
          kubectl -n algot-data get deployment data-ingestion -o json > /tmp/rollback/ingestion.json 2>/dev/null || echo '{}' > /tmp/rollback/ingestion.json

      # The identity of the bound market data volume, recorded before
      # anything is applied and re-checked afterwards. A deployment that
      # rebinds the claim to a new volume produces a database that is
      # healthy and empty, which every other check here would pass.
      - name: Snapshot the protected market data state
        run: bash deployment/scripts/assert-data-protection.sh snapshot /tmp/rollback/data-protection.state

      - name: Deploy
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
          COMPONENT: ${{ inputs.component }}
        run: bash deployment/scripts/deploy-data-platform.sh

      - name: Verify deployment health
        run: bash deployment/scripts/verify-deployment.sh

      # Cross-service: exercises the ingestion wire payload through the
      # database's ClusterIP Service from a client pod, plus backup/restore,
      # the volume-expansion guard and pod-replacement recovery. Its own
      # synthetic rows are isolated behind an itest-<run id> provider and
      # removed afterwards; pre-existing market data is never written to.
      #
      # Only meaningful when the database is part of this deployment.
      - name: Cross-service integration tests
        if: inputs.run_integration_tests && inputs.component != 'ingestion'
        run: bash deployment/scripts/run-database-integration-tests.sh

      # Runs whether or not the deployment succeeded: a failed deploy is
      # exactly when the volume is most likely to have been disturbed. This
      # is a separate step from the rollback so the data verdict is recorded
      # before anything else is changed.
      - name: Confirm the market data volume is untouched
        if: always()
        run: bash deployment/scripts/assert-data-protection.sh compare /tmp/rollback/data-protection.state

      - name: Roll back on failure
        if: failure()
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          # Only what this run deployed is rolled back. Rolling back a
          # service this run never touched would undo someone else's
          # successful deployment, and for the database it would restart the
          # pod that holds the market data volume for no reason.
          echo "::warning::deployment or verification failed; rolling back component '$COMPONENT'"
          status=0

          if [[ "$COMPONENT" == "both" || "$COMPONENT" == "database" ]]; then
            kubectl -n algot-data rollout undo statefulset/market-data-db || status=1
            kubectl -n algot-data rollout status statefulset/market-data-db --timeout=600s || status=1
          else
            echo "database not deployed by this run; left alone"
          fi

          if [[ "$COMPONENT" == "both" || "$COMPONENT" == "ingestion" ]]; then
            kubectl -n algot-data rollout undo deployment/data-ingestion || status=1
            kubectl -n algot-data rollout status deployment/data-ingestion --timeout=420s || status=1
          else
            echo "ingestion not deployed by this run; left alone"
          fi

          kubectl -n algot-data get statefulset,deployment,pod -o wide

          if (( status != 0 )); then
            echo "::error::the rollback did not complete cleanly; the namespace needs manual inspection"
          fi

      - name: Re-confirm data protection after rollback
        if: failure()
        run: bash deployment/scripts/assert-data-protection.sh compare /tmp/rollback/data-protection.state

      - name: Revoke temporary Kubernetes API access
        if: always()
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/api_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_REGION || 'uk-london-1' }}
          OCI_CLI_AUTH: api_key
        run: bash deployment/scripts/ci-api-access.sh revoke

      - name: Remove credentials
        if: always()
        run: rm -f ~/.oci/api_key.pem "$HOME/.kube/algot-oke.config"
