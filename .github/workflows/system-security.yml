name: System security
on:
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    uses: ./.github/workflows/reusable-security.yml
    with:
      service: database
  ingestion:
    uses: ./.github/workflows/reusable-security.yml
    with:
      service: ingestion
