name: Ingestion production
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
permissions:
  contents: read
jobs:
  deploy:
    if: vars.INGESTION_PRODUCTION_ENABLED == 'true' && vars.INGESTION_PRODUCTION_APPROVED_SHA == github.sha
    runs-on: [self-hosted, "ingestion-production"]
    environment: ingestion-production
    timeout-minutes: 30
    concurrency: ingestion-production
    steps:
      - name: Require approved immutable digest
        env:
          IMAGE: ${{ inputs.image }}
        run: '[[ "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]'
      - name: Deploy validated digest
        env:
          IMAGE: ${{ inputs.image }}
        run: /opt/algot-ingestion/deploy.sh production "$IMAGE"
