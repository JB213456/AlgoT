name: Shared Docker build
on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify isolated Docker context
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in database) DIR=Data/Database ;; ingestion) DIR=Data/Data_Ingestion ;; *) exit 1 ;; esac
          test ! -e "$DIR/Strategies"
          docker build --pull -t "algot-$SERVICE:${{ github.sha }}" "$DIR"
          test -n "$(docker image inspect "algot-$SERVICE:${{ github.sha }}" --format '{{.Config.User}}')"
      - name: Save exact candidate for security validation
        env:
          SERVICE: ${{ inputs.service }}
        run: docker save "algot-$SERVICE:${{ github.sha }}" -o "/tmp/$SERVICE-image.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.service }}-image
          path: /tmp/${{ inputs.service }}-image.tar
          if-no-files-found: error
          retention-days: 1
