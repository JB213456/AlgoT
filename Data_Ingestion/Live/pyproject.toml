[project]
name = "live-ingestion"
version = "0.1.0"
description = "Standalone, live-only market data ingestion engine (Alpaca free IEX feed)"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.45.0,<0.46.0",
    "python-dotenv>=1.0.0",
    "websockets>=17.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["live_ingestion*"]
