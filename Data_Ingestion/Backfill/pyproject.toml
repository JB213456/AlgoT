[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backfill-engine"
version = "0.1.0"
description = "Historical market data backfill engine (Alpaca + London Strategic Edge free tiers)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
market-backfill = "backfill_engine.cli:main"

[tool.setuptools]
packages = ["backfill_engine", "backfill_engine.providers"]
