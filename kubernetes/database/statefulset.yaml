# Market data database: FastAPI + uvicorn over the market_data_db package,
# backed by the Terraform-owned 80 GB OCI block volume.
#
# Single replica by design: the store is a local parquet/DuckDB tree on one
# ReadWriteOnce volume, so a second replica would corrupt it. StatefulSet
# (not Deployment) guarantees the old pod is fully terminated and its volume
# detached before a replacement starts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: market-data-db
  namespace: algot-data
  labels:
    app.kubernetes.io/name: market-data-db
    app.kubernetes.io/part-of: algot
    app.kubernetes.io/component: database
spec:
  replicas: 1
  serviceName: market-data-db
  selector:
    matchLabels:
      app.kubernetes.io/name: market-data-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-data-db
        app.kubernetes.io/part-of: algot
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: market-data-db
      automountServiceAccountToken: false
      # 30s matches uvicorn's --timeout-graceful-shutdown, so the FastAPI
      # lifespan hook can flush and close the store before SIGKILL.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Makes the attached block volume group-writable by the db user.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: market-data-db
          # Pinned to an immutable digest by deployment/scripts; never :latest.
          image: __DATABASE_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MARKET_DATA_DB_ROOT
              value: /data
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8000"
            # Keep at 1: the parquet store uses a single-writer file lock, and
            # multiple workers would need the Postgres metadata backend.
            - name: UVICORN_WORKERS
              value: "1"
            - name: LOG_LEVEL
              value: INFO
            - name: MARKET_DATA_DB_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: market-data-db-auth
                  key: api-keys
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Memory sized for the worst query shape, not the idle footprint.
          #
          # A dedup read is a ROW_NUMBER() window over everything matching the
          # filter, so its peak scales with dataset size and with how many such
          # reads are in flight -- not with the size of the result. Idle usage
          # is ~150 MiB and a single read's peak was ~300 MiB, but a handful of
          # concurrent dedup reads over the 2M-row quotes dataset exhausted the
          # old 1536Mi limit and the kernel OOM-killed the database five times
          # (exit 137). A single-replica store going down takes the whole data
          # tier with it, so the limit now carries real headroom.
          #
          # This is the containment, not the cure: the images also bound
          # DuckDB's own query budget (MARKET_DATA_DB_DUCKDB_MEMORY_LIMIT) so a
          # heavy query spills to disk instead of growing without limit. The
          # higher ceiling is what keeps the pod alive if that budget is ever
          # unset or too generous.
          #
          # 2Gi is the per-container ceiling the namespace LimitRange allows;
          # going above it needs that policy raised too, which is not worth
          # doing while the DuckDB budget is the real control.
          #
          # Costs nothing: memory is not separately billed on Always Free, the
          # nodes carry ~8.6 GiB allocatable each, and requests -- which are
          # what actually reserve capacity for the future AlgoT namespaces --
          # are unchanged.
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 2Gi
          # Startup probe carries the cold-start cost: first boot creates the
          # schema and metadata store. Up to 150s before giving up, which
          # keeps the liveness probe's own timeout tight afterwards.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          # /health runs SELECT 1 against the metadata store, so readiness
          # tracks real query capability rather than just process liveness.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: market-data-db-data
        # readOnlyRootFilesystem is on, so scratch space must be explicit.
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
