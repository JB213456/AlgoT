# Lightweight platform health reporting.
#
# Deliberately not a monitoring stack: no Prometheus, no dedicated namespace,
# no billed OCI Monitoring alarms. It reports to its pod log, which
# `kubectl logs` reads, and exits non-zero on a problem so the Job shows as
# failed and `kubectl get cronjob` surfaces it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: algot-data-monitor
  namespace: algot-data
  labels:
    app.kubernetes.io/name: algot-data-monitor
    app.kubernetes.io/part-of: algot
spec:
  schedule: "*/30 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: algot-data-monitor
            algot.io/role: maintenance
            algot.io/database-client: "true"
            algot.io/oci-metadata: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: algot-maintenance
          automountServiceAccountToken: false
          # Reads the volume for utilisation figures, so it needs the
          # database's node.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: market-data-db
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              image: __TOOLBOX_IMAGE__
              command: [/bin/sh, /scripts/monitor-platform.sh]
              env:
                - name: HOME
                  value: /tmp
                - name: OCI_CLI_AUTH
                  value: instance_principal
                - name: BACKUP_BUCKET
                  value: algot-backups
                - name: OCI_NAMESPACE
                  value: __OCI_NAMESPACE__
                - name: DB_URL
                  value: http://market-data-db.algot-data.svc.cluster.local:8000
              envFrom:
                - secretRef:
                    name: market-data-db-client
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 25m, memory: 96Mi }
                limits: { cpu: 300m, memory: 256Mi }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: market-data-db-data
                readOnly: true
            - name: scripts
              configMap: { name: maintenance-scripts, defaultMode: 0555 }
            - name: tmp
              emptyDir: { sizeLimit: 128Mi }
